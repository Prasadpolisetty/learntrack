<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="screen" x1="930" y1="180" x2="1470" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".075"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".015"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".20"/>
    </pattern>
    <clipPath id="meshClip"><path d="M620 690C820 545 970 765 1160 590s300-20 440-170v450H620z"/></clipPath>
  </defs>

  <!-- Subtle data-learning mesh -->
  <g opacity=".42">
    <path d="M480 690C710 520 850 760 1050 610s330-30 500-190" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
    <path d="M510 745C730 575 865 810 1085 655s315-38 475-180" stroke="#fff" stroke-opacity=".10" stroke-width="2"/>
    <path d="M540 795C755 635 890 855 1110 700s300-45 450-170" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
    <path d="M620 690C820 545 970 765 1160 590s300-20 440-170v450H620z" fill="url(#dots)" clip-path="url(#meshClip)"/>
  </g>

  <!-- Laptop body -->
