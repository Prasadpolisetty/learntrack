    <path d="M770 735L1542 703" stroke-opacity=".22" stroke-width="2"/>
    <path d="M1040 757L1310 727" stroke-opacity=".18" stroke-width="2"/>
  </g>

  <!-- Code editor window -->
  <g stroke="#fff" stroke-opacity=".32" stroke-width="2">
    <rect x="915" y="245" width="230" height="58" rx="12" fill="#fff" fill-opacity=".035"/>
    <path d="M950 263L934 274L950 286M975 263L991 274L975 286M1004 286L1020 263" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M930 340H1150M930 375H1090M930 410H1120M930 445H1050M930 480H1110" stroke-linecap="round" stroke-opacity=".19" stroke-width="8"/>
    <path d="M930 515H1070M930 550H1135" stroke-linecap="round" stroke-opacity=".12" stroke-width="8"/>
  </g>

  <!-- Analytics panels -->
  <g stroke="#fff" stroke-opacity=".27" stroke-width="2">
    <rect x="1170" y="260" width="220" height="178" rx="17" fill="#fff" fill-opacity=".025"/>
    <path d="M1205 402V365H1232V402M1250 402V340H1277V402M1295 402V310H1322V402M1340 402V285H1367V402" fill="#fff" fill-opacity=".14" stroke="none"/>
    <path d="M1200 410H1370" stroke-opacity=".18"/>
    <rect x="1170" y="465" width="220" height="145" rx="17" fill="#fff" fill-opacity=".02"/>
    <path d="M1194 573L1237 540L1270 552L1310 505L1345 520L1370 486" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1370" cy="486" r="5" fill="#fff" fill-opacity=".6" stroke="none"/>
  </g>

  <!-- Database stack -->
  <g stroke="#fff" stroke-opacity=".17" stroke-width="3">
    <ellipse cx="650" cy="370" rx="76" ry="25"/>
    <path d="M574 370V485C574 499 608 511 650 511S726 499 726 485V370"/>
    <path d="M574 411C574 425 608 437 650 437S726 425 726 411M574 450C574 464 608 476 650 476S726 464 726 450"/>
