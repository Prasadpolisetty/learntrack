    <rect x="330" y="480" width="210" height="270" rx="18" transform="rotate(-8 330 480)" fill="#fff" fill-opacity=".018"/>
    <path d="M373 548L389 561L415 530M435 548H500M365 615L381 628L407 597M427 615H490M357 682L373 695L399 664M419 682H474" />
  </g>

  <!-- Small floating chart grid -->
  <g stroke="#fff" stroke-opacity=".12" stroke-width="2">
    <path d="M210 260H470M210 300H470M210 340H470M210 380H470M250 220V420M310 220V420M370 220V420M430 220V420"/>
    <path d="M230 390L288 350L340 365L402 295L458 315" stroke-opacity=".22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>