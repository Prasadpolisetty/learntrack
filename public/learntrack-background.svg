    <path d="M835 210Q842 184 870 180L1395 130Q1425 128 1428 157L1472 625Q1475 653 1448 660L897 720Q867 723 864 694Z"
      fill="url(#screen)" fill-opacity=".75" stroke-opacity=".30" stroke-width="4"/>
